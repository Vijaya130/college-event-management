<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>College Event Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="page-wrapper">

  <!-- HERO CARD -->
  <div class="hero-card">
    <div class="hero-logo">
      <span class="cap">🎓</span>
      <span>YOUR COLLEGE NAME</span>
    </div>
    <h1 class="hero-title">College Event <span>Management</span></h1>
    <p class="hero-subtitle">Easily add and manage your campus events</p>
    <button class="btn-add-hero" onclick="openModal()">Add Event</button>
    <div class="hero-illustration">
      <div class="hero-bg-wave"></div>
      <div class="hero-stars">✦ ✦ ✦</div>
      <div class="hero-balloon2">🩷</div>
      <div class="hero-balloon">🎈</div>
    </div>
  </div>

  <!-- MAIN CARD -->
  <div class="main-card">
    <div class="search-row">
      <input class="search-input" id="searchInput" type="text" placeholder="Search events..." oninput="renderEvents()"/>
      <button class="btn-add" onclick="openModal()">Add Event</button>
    </div>
    <div class="tabs-row">
      <button class="tab-btn active" onclick="switchTab(this)">Upcoming</button>
      <button class="tab-btn" onclick="switchTab(this)">Ongoing</button>
      <button class="tab-btn" onclick="switchTab(this)">Completed</button>
      <select class="filter-select" id="categoryFilter" onchange="renderEvents()">
        <option value="">Filter: All Categories</option>
        <option value="Concert">Concert</option>
        <option value="Festival">Festival</option>
        <option value="Workshop">Workshop</option>
        <option value="Sports">Sports</option>
        <option value="Seminar">Seminar</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <h2 class="section-title">All Events</h2>
    <div class="event-list" id="eventList"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">➕ Add New Event</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Event Name</label>
      <input class="form-input" id="eventName" type="text" placeholder="e.g. Music Night"/>
    </div>
    <div class="form-group">
      <label class="form-label">Event Type</label>
      <select class="form-select" id="eventType">
        <option value="">Select type...</option>
        <option>Concert</option>
        <option>Festival</option>
        <option>Workshop</option>
        <option>Sports</option>
        <option>Seminar</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date</label>
        <input class="form-input" id="eventDate" type="date"/>
      </div>
      <div class="form-group">
        <label class="form-label">Time</label>
        <input class="form-input" id="eventTime" type="time"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Venue</label>
      <input class="form-input" id="eventVenue" type="text" placeholder="e.g. Main Auditorium"/>
    </div>

        <div class="form-group">
      <label class="form-label">Status</label>
      <select class="form-select" id="eventStatus">
        <option value="upcoming">Upcoming</option>
        <option value="ongoing">Ongoing</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <button class="btn-submit" onclick="addEvent()">🎉 Add Event</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
